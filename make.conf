COMMON_FLAGS="-O2 -pipe -march=alderlake -mtune=alderlake -mabm -mno-kl -mno-pconfig -mno-sgx -mno-widekl -mshstk --param=l1-cache-line-size=64 --param=l1-cache-size=32 --param=l2-cache-size=12288 -fvect-cost-model=cheap"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j12 -l8"
RUSTFLAGS="-C target-cpu=alderlake -C opt-level=3 -C strip=symbols"

LC_MESSAGES=C.utf8
L10N="en-US en-GB fil ja vi"
ACCEPT_LICENSE="*"

INPUT_DEVICES="libinput"
VIDEO_CARDS="intel"
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

EMERGE_DEFAULT_OPTS="--jobs=3 --load-average=8 --verbose --keep-going=y --with-bdeps=y"
FEATURES="parallel-install nodoc noman compressdebug splitdebug"

GRUB_PLATFORMS="efi-64"

USE="
acpi
vulkan
opengl
egl
gles2
vaapi
lm-sensors
alsa
pulseaudio
pipewire
screencast
aac
opus
ffmpeg
vpx
png
jpeg
webp
heif
lz4
zstd
wifi
bluetooth
networkmanager
cups
X
wayland
lua
jit
asm
crypt
-doc
"
